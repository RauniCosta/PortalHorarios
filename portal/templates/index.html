<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Painel de Horários - CPS</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Slab:wght@700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        <header class="main-header">
            <div class="header-content">
                <div class="header-left">
                    <img src="{{ url_for('static', filename='images/logo_cps.png') }}" alt="Logo Centro Paula Souza" class="header-logo">
                    <h1 id="main-title">Painel de Horários</h1>
                </div>
                <div class="header-right">
                    <a href="{{ url_for('admin_login') }}" class="admin-login-link">
                        <i class="fas fa-lock"></i> Área Administrativa
                    </a>
                </div>
            </div>
        </header>

        <div class="container">
            <div class="info-header">
                <h2 id="current-day-period">Carregando...</h2>
                <h3 id="current-time"></h3>
            </div>
            <div id="horario-table-container">
                <p class="no-data-message">Carregando horários, por favor aguarde...</p>
            </div>
        </div>

        <script>
            document.addEventListener('DOMContentLoaded', () => {
                // Elementos da UI
                const mainTitle = document.getElementById('main-title');
                const tableContainer = document.getElementById('horario-table-container');
                const currentTimeDisplay = document.getElementById('current-time');
                const currentDayPeriodDisplay = document.getElementById('current-day-period');

                // Constantes e Mapeamentos
                const GRADE_HORARIOS_FIXOS_POR_CATEGORIA = JSON.parse('{{ grade_horarios_fixos_por_categoria | tojson | safe }}');
                const PERIODO_MAP_FROM_ID = { "1": "Manhã", "2": "Tarde", "3": "Noturno", "4": "Integral" };
                const TURMAS_POR_PAGINA = 8; // A constante original era 8, mas você pode ajustar para 6 se preferir.
                const TEMPO_PAGINACAO = 15000;

                // Variáveis de Estado
                let dadosGlobais = {};
                let serverInfo = {};
                let pageCycleInterval = null;

                async function fetchServerState() {
                    try {
                        const [horariosRes, serverInfoRes] = await Promise.all([
                            const dadosInjetados = {{ dados_override|tojson|safe if dados_override else 'null' }};

                            if (dadosInjetados) {
                                // Se o backend injetou os dados, use-os diretamente
                                processarDados(dadosInjetados);
                            } else {
                                // Senão, busca via API como antes
                                fetch('/api/horarios')
                                    .then(response => response.json())
                                    .then(data => processarDados(data))
                                    .catch(error => console.error('Erro ao carregar dados dos horários:', error));
                            }
                            
                            fetch('/api/server_info')
                        ]);
                        if (!horariosRes.ok || !serverInfoRes.ok) throw new Error('Falha de comunicação com o servidor.');
                        dadosGlobais = await horariosRes.json();
                        serverInfo = await serverInfoRes.json();
                        return true;
                    } catch (error) {
                        console.error("Não foi possível carregar os dados:", error);
                        tableContainer.innerHTML = `<p class="error-message">${error.message}</p>`;
                        return false;
                    }
                }
                
                function renderCurrentPage(paginas, disciplinaMap, pageIndex, horariosColunas, horariosDoPeriodoCompleto, alocacoesSource, diaKey) {
                    const turmasVisiveis = paginas[pageIndex] || [];
                    
                    let tableHTML = '<table><thead><tr><th class="turma-header">Turma</th>';
                    horariosColunas.forEach(h => {
                        const apelido = horariosDoPeriodoCompleto[h] || 'Aula';
                        tableHTML += `<th>${h.replace(' - ', '<br>')}`;
                        if (apelido.toUpperCase() === 'INTERVALO' || apelido.toUpperCase() === 'ALMOÇO') {
                            tableHTML += `<br><span class="intervalo-label">${apelido.toUpperCase()}</span>`;
                        } else {
                            tableHTML += `<br><span class="horario-apelido">${apelido}</span>`;
                        }
                        tableHTML += `</th>`;
                    });
                    tableHTML += '</tr></thead><tbody>';
                    const headersText = [];
                    horariosColunas.forEach(h => {
                        const apelido = horariosDoPeriodoCompleto[h] || 'Aula';
                        let label = h;
                        if (apelido.toUpperCase() !== 'INTERVALO' && apelido.toUpperCase() !== 'ALMOÇO') {
                            label += ` (${apelido})`;
                        } else {
                            label = apelido.toUpperCase();
                        }
                        headersText.push(label);
                    });


                    turmasVisiveis.forEach(turma => {
                        tableHTML += `<tr><td class="turma-cell">${turma.apelido}</td>`;
                        
                        horariosColunas.forEach((horario_chave, index) => { // << Adicionado 'index'
                            const headerLabel = headersText[index]; // Pega o texto do cabeçalho correspondente
                            
                            if (["INTERVALO", "Almoço"].includes(horariosDoPeriodoCompleto[horario_chave])) {
                                // Adiciona data-label mesmo para o intervalo para manter a estrutura
                                tableHTML += `<td class="intervalo-cell" data-label="Intervalo"></td>`;
                            } else {
                                const aulasNesteSlot = diaKey 
                                    ? (alocacoesSource[turma.apelido]?.[diaKey]?.[horario_chave] || [])
                                    : (alocacoesSource[turma.apelido]?.[horario_chave] || []);

                                // << ALTERAÇÃO: Adicionado o atributo data-label
                                tableHTML += `<td data-label="${headerLabel}">`; 

                                if (aulasNesteSlot.length > 0) {
                                    aulasNesteSlot.forEach(aula_info => {
                                        const sigla = disciplinaMap[aula_info.disciplina] || '???';
                                        tableHTML += `<div class="aula-info">
                                                        <span class="sala">${aula_info.sala || ''}</span>
                                                        <span class="sigla">${sigla}</span>
                                                        <span class="professor">${aula_info.professor || 'N/A'}</span>
                                                    </div>`;
                                    });
                                } else {
                                    tableHTML += '<span class="aula-vaga">Aula Vaga</span>';
                                }
                                tableHTML += '</td>';
                            }
                        });
                        tableHTML += '</tr>';
                    });

                    turmasVisiveis.forEach(turma => {
                        tableHTML += `<tr><td class="turma-cell">${turma.apelido}</td>`;
                        horariosColunas.forEach(horario_chave => {
                            if (["INTERVALO", "Almoço"].includes(horariosDoPeriodoCompleto[horario_chave])) {
                                tableHTML += `<td class="intervalo-cell"></td>`;
                            } else {
                                const aulasNesteSlot = diaKey 
                                    ? (alocacoesSource[turma.apelido]?.[diaKey]?.[horario_chave] || [])
                                    : (alocacoesSource[turma.apelido]?.[horario_chave] || []);

                                tableHTML += '<td>';
                                if (aulasNesteSlot.length > 0) {
                                    aulasNesteSlot.forEach(aula_info => {
                                        const sigla = disciplinaMap[aula_info.disciplina] || '???';
                                        tableHTML += `<div class="aula-info">
                                                        <span class="sala">${aula_info.sala || ''}</span>
                                                        <span class="sigla">${sigla}</span>
                                                        <span class="professor">${aula_info.professor || 'N/A'}</span>
                                                    </div>`;
                                    });
                                } else {
                                    tableHTML += '<span class="aula-vaga">Aula Vaga</span>';
                                }
                                tableHTML += '</td>';
                            }
                        });
                        tableHTML += '</tr>';
                    });
                    tableHTML += '</tbody></table>';
                    tableContainer.innerHTML = tableHTML;
                }

                function setupDisplay() {
                    if (pageCycleInterval) clearInterval(pageCycleInterval);

                    currentDayPeriodDisplay.textContent = serverInfo.dia_display || "Carregando...";
                    currentTimeDisplay.textContent = `Horário do Servidor: ${serverInfo.hora || "Carregando..."}`;
                    
                    const { turmas, disciplinas } = dadosGlobais;
                    const disciplinaParaSiglaMap = Object.fromEntries((disciplinas || []).map(d => [d.componente, d.sigla]));

                    if (serverInfo.is_reposicao) {
                        mainTitle.textContent = `Painel de Horários | ${serverInfo.reposicao_info.descricao}`;
                        
                        const alocacoesSabado = serverInfo.reposicao_info.horarios_alocados || {};
                        const turmasComAulas = Object.keys(alocacoesSabado);
                        
                        if (turmasComAulas.length === 0) {
                            tableContainer.innerHTML = `<p class="no-data-message">Nenhuma aula de reposição alocada para hoje.</p>`;
                            return;
                        }

                        const turmasDoSabado = turmas.filter(t => turmasComAulas.includes(t.apelido));
                        const paginasDeTurmas = [];
                        for (let i = 0; i < turmasDoSabado.length; i += TURMAS_POR_PAGINA) {
                            paginasDeTurmas.push(turmasDoSabado.slice(i, i + TURMAS_POR_PAGINA));
                        }

                        const horariosDoSabado = serverInfo.reposicao_info.grade_horarios;
                        const horariosColunas = Object.keys(horariosDoSabado);

                        let currentPage = 0;
                        renderCurrentPage(paginasDeTurmas, disciplinaParaSiglaMap, currentPage, horariosColunas, horariosDoSabado, alocacoesSabado, null);

                        if (paginasDeTurmas.length > 1) {
                            pageCycleInterval = setInterval(() => {
                                currentPage = (currentPage + 1) % paginasDeTurmas.length;
                                renderCurrentPage(paginasDeTurmas, disciplinaParaSiglaMap, currentPage, horariosColunas, horariosDoSabado, alocacoesSabado, null);
                            }, TEMPO_PAGINACAO);
                        }
                    } 
                    else {
                        const { periodo_atual, dia_key } = serverInfo;
                        mainTitle.textContent = `Painel de Horários | Período da ${periodo_atual || 'Manhã'}`;

                        if (periodo_atual === "Fora do Horário" || ['domingo', 'sabado'].includes(dia_key)) {
                            tableContainer.innerHTML = `<p class="no-data-message">Não há aulas em andamento neste momento.</p>`;
                            return;
                        }

                        const turmasDoPeriodo = (turmas || []).filter(turma => {
                            const periodoDaTurma = PERIODO_MAP_FROM_ID[turma.periodo];
                            if (periodo_atual === "Manhã") return periodoDaTurma === "Manhã" || periodoDaTurma === "Integral";
                            if (periodo_atual === "Tarde") return periodoDaTurma === "Tarde" || periodoDaTurma === "Integral";
                            return periodoDaTurma === periodo_atual;
                        });
                        
                        const turmasComAulasHoje = turmasDoPeriodo.filter(turma => {
                            const alocacoesDaTurma = dadosGlobais.horarios_alocados[turma.apelido];
                            return alocacoesDaTurma && alocacoesDaTurma[dia_key] && Object.keys(alocacoesDaTurma[dia_key]).length > 0;
                        });

                        if (turmasComAulasHoje.length === 0) {
                            tableContainer.innerHTML = `<p class="no-data-message">Nenhuma aula alocada para as turmas deste período hoje.</p>`;
                            return;
                        }
                        
                        // ***** LÓGICA DE AGRUPAMENTO E PAGINAÇÃO RESTAURADA *****
                        const turmasPorAno = { '1': [], '2': [], '3': [], 'Outros': [] };
                        turmasComAulasHoje.forEach(turma => {
                            const match = turma.nome_completo.match(/^[123]º/);
                            const ano = match ? match[0][0] : 'Outros';
                            turmasPorAno[ano].push(turma);
                        });

                        for(const ano in turmasPorAno) {
                            turmasPorAno[ano].sort((a, b) => a.apelido.localeCompare(b.apelido, 'pt-BR'));
                        }

                        let paginasDeTurmas = [];
                        ['1', '2', '3', 'Outros'].forEach(ano => {
                            const turmasDoAno = turmasPorAno[ano];
                            for (let i = 0; i < turmasDoAno.length; i += TURMAS_POR_PAGINA) {
                                paginasDeTurmas.push(turmasDoAno.slice(i, i + TURMAS_POR_PAGINA));
                            }
                        });
                        // ***** FIM DA LÓGICA RESTAURADA *****
                        
                        const categoriaExemplo = turmasComAulasHoje[0]?.categoria || "Ensino Médio";
                        const horariosDoPeriodoCompleto = GRADE_HORARIOS_FIXOS_POR_CATEGORIA[categoriaExemplo]?.[periodo_atual];
                        if (!horariosDoPeriodoCompleto) {
                            tableContainer.innerHTML = `<p class="no-data-message">Grade de horários não encontrada para este período.</p>`;
                            return;
                        }
                        const horariosColunas = Object.keys(horariosDoPeriodoCompleto);

                        let currentPage = 0;
                        renderCurrentPage(paginasDeTurmas, disciplinaParaSiglaMap, currentPage, horariosColunas, horariosDoPeriodoCompleto, dadosGlobais.horarios_alocados, dia_key);

                        if (paginasDeTurmas.length > 1) {
                            pageCycleInterval = setInterval(() => {
                                currentPage = (currentPage + 1) % paginasDeTurmas.length;
                                renderCurrentPage(paginasDeTurmas, disciplinaParaSiglaMap, currentPage, horariosColunas, horariosDoPeriodoCompleto, dadosGlobais.horarios_alocados, dia_key);
                            }, TEMPO_PAGINACAO);
                        }
                    }
                }

                async function start() {
                    const success = await fetchServerState();
                    if (success) {
                        setupDisplay();
                        setInterval(async () => {
                            const oldPeriod = serverInfo.periodo_atual;
                            const oldIsReposicao = serverInfo.is_reposicao;
                            
                            await fetchServerState();

                            if (serverInfo.periodo_atual !== oldPeriod || serverInfo.is_reposicao !== oldIsReposicao) {
                                setupDisplay();
                            } else {
                                currentTimeDisplay.textContent = `Horário do Servidor: ${serverInfo.hora || "Carregando..."}`;
                            }
                        }, 60000);
                    }
                }
                
                start();
            });
            </script>
    </body>
</html>

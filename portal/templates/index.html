<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Horário das Salas</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/display_style.css') }}"
    />
  </head>
  <body>
    <header class="main-header">
      <div class="header-logo">
        <img
          src="{{ url_for('static', filename='images/logo_cps.png') }}"
          alt="Logo da Escola"
        />
      </div>
      <div class="header-info">
        <h1 id="page-title">Horário de Aulas</h1>
      </div>
      <div class="header-right-panel">
        <div class="header-clock">
          <div id="current-day-period"></div>
          <div id="current-time"></div>
        </div>
        <div class="header-login">
          <a href="{{ url_for('auth.login') }}" class="admin-login-link">
            <i class="fas fa-user-shield"></i>
            <span>Login Admin</span>
          </a>
        </div>
      </div>
    </header>

    <div id="grid-container" class="grid-container"></div>

    <script>
      // --- DADOS VINDOS DO BACKEND ---
      const paginasPorPeriodo = {{ paginas_por_periodo|tojson }};
      const horariosAlocados = {{ horarios_alocados|tojson }};
      const gradeHorarios = {{ grade_horarios|tojson }};
      const TEMPO_PAGINACAO = 15000; // 15 segundos

      // --- ELEMENTOS DA PÁGINA ---
      const gridContainer = document.getElementById('grid-container');
      // --- CORREÇÃO APLICADA AQUI ---
      // A variável pageTitle agora é definida corretamente, capturando o elemento h1.
      const pageTitle = document.getElementById('page-title');

      // --- ESTADO DA APLICAÇÃO ---
      let periodoAtual = null;
      let paginasDoPeriodoAtual = [];
      let paginaAtualIndex = 0;
      let carrosselIntervalo = null;

      // --- FUNÇÃO PARA RENDERIZAR UMA PÁGINA ---
      function renderizarPagina(index) {
          if (paginasDoPeriodoAtual.length === 0) {
              gridContainer.innerHTML = `<h2 class="periodo-title">Nenhuma turma com aulas alocadas para ${periodoAtual}.</h2>`;
              pageTitle.innerText = "Horário de Aulas";
              return;
          }

          const pagina = paginasDoPeriodoAtual[index];
          pageTitle.innerText = `${pagina.titulo} - ${periodoAtual}`;

          const isTecnico = pagina.titulo.includes('Curso Técnico');
          const categoria = isTecnico ? 'Curso Técnico' : 'Ensino Médio';
          const horariosDaPagina = gradeHorarios[categoria]?.[periodoAtual] || {};

          let tableHTML = `<table class="horario-table">`;
          tableHTML += `<thead><tr><th style="width: 120px;">Turma</th>`;
          for (const horario in horariosDaPagina) {
              if (horariosDaPagina[horario].toUpperCase() !== 'INTERVALO') {
                  tableHTML += `<th>${horariosDaPagina[horario]}<br><small>${horario}</small></th>`;
              }
          }
          tableHTML += `</tr></thead>`;

          tableHTML += `<tbody>`;
          pagina.turmas.forEach(turma => {
              tableHTML += `<tr><td class="turma-header-cell">${turma.apelido}</td>`;
              const diaSemana = ['domingo', 'segunda-feira', 'terca-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sabado'][new Date().getDay()];
              for (const horario in horariosDaPagina) {
                  if (horariosDaPagina[horario].toUpperCase() !== 'INTERVALO') {
                      const aulas = horariosAlocados[turma.id]?.[diaSemana]?.[horario];
                      tableHTML += `<td class="aula-cell">`;
                      if (aulas && aulas.length > 0) {
                          const salasTexto = aulas.map(a => a.sala).join(' / ');
                          const disciplinasTexto = aulas.map(a => a.disciplina).join(' / ');
                          tableHTML += `<div class="aula-content"><div class="aula-sala">${salasTexto}</div><div class="aula-disciplina">${disciplinasTexto}</div></div>`;
                      }
                      tableHTML += `</td>`;
                  }
              }
              tableHTML += `</tr>`;
          });
          tableHTML += `</tbody></table>`;
          gridContainer.innerHTML = tableHTML;
      }

      // --- FUNÇÃO PRINCIPAL QUE CONTROLA O FLUXO ---
      function atualizarDisplay() {
          const now = new Date();
          const hora = now.getHours();
          let novoPeriodo;

          if (hora < 12) novoPeriodo = 'Manhã';
          else if (hora < 18) novoPeriodo = 'Tarde';
          else novoPeriodo = 'Noite';

          if (novoPeriodo !== periodoAtual) {
              periodoAtual = novoPeriodo;
              paginasDoPeriodoAtual = paginasPorPeriodo[periodoAtual] || [];
              paginaAtualIndex = 0;

              if (carrosselIntervalo) clearInterval(carrosselIntervalo);

              renderizarPagina(0);

              if (paginasDoPeriodoAtual.length > 1) {
                  carrosselIntervalo = setInterval(() => {
                      paginaAtualIndex = (paginaAtualIndex + 1) % paginasDoPeriodoAtual.length;
                      renderizarPagina(paginaAtualIndex);
                  }, TEMPO_PAGINACAO);
              }
          }
      }

      // --- INICIALIZAÇÃO E RELÓGIOS ---
      atualizarDisplay();
      setInterval(atualizarDisplay, 60000);

      function updateClock() {
          const now = new Date();
          const dayOfWeek = now.toLocaleDateString('pt-BR', { weekday: 'long' });
          const time = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
          const hour = now.getHours();
          let periodText = 'Manhã';
          if (hour >= 12 && hour < 18) { periodText = 'Tarde'; }
          else if (hour >= 18) { periodText = 'Noite'; }

          document.getElementById('current-day-period').innerText = `${dayOfWeek.split('-')[0]}, ${periodText}`;
          document.getElementById('current-time').innerText = time;
      }
      setInterval(updateClock, 1000);
      updateClock();
    </script>
  </body>
</html>

{% extends "admin_layout.html" %}

{% block title %}{{ title }}{% endblock %}

{% block page_title %}<i class="fas fa-plus-circle fa-fw"></i> {{ title }}{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px; margin: auto;">
    <form method="POST">
        <div class="form-group">
            <label for="turma_id">Turma</label>
            <select id="turma_id" name="turma_id" class="form-control" required>
                <option value="">-- Selecione a Turma --</option>
                {% for turma in turmas %}
                    <option value="{{ turma.id }}">{{ turma.nome }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="disciplina_id">Disciplina</label>
            <select id="disciplina_id" name="disciplina_id" class="form-control" required>
                <option value="">-- Selecione a Disciplina --</option>
                {% for disciplina in disciplinas %}
                    <option value="{{ disciplina.id }}">{{ disciplina.nome }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="professor_id">Professor Padrão</label>
            <select id="professor_id" name="professor_id" class="form-control" required>
                <option value="">-- Selecione o Professor --</option>
                {% for professor in professores %}
                    <option value="{{ professor.id }}">{{ professor.nome }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="aulas_semanais">Quantidade de Aulas na Semana</label>
            <input type="number" id="aulas_semanais" name="aulas_semanais" class="form-control" min="1" required>
        </div>

        <hr>
        <div class="form-actions">
            <a href="{{ url_for('main.matriz_curricular_list') }}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Salvar Atribuição</button>
        </div>
    </form>
</div>
{% endblock %}

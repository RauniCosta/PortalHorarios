{% extends "admin_layout.html" %}

{% block title %}{{ title }}{% endblock %}
{% block page_title %}<i class="fas fa-users"></i> {{ title }}{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px; margin: auto;">
    <form method="post" action="{{ form_action }}">
        <div class="form-grid-2">
            <div class="form-group form-span-2">
                <label for="nome_completo">Nome Completo</label>
                <input type="text" id="nome_completo" name="nome_completo" value="{{ item.nome_completo if item else '' }}" required>
            </div>

            <div class="form-group">
                <label for="apelido">Apelido</label>
                <input type="text" id="apelido" name="apelido" value="{{ item.apelido if item else '' }}" required>
            </div>
            
            <div class="form-group">
                <label for="local">Local / Filial</label>
                <input type="text" id="local" name="local" value="{{ item.local if item else '' }}" placeholder="Ex: Unidade Centro" required>
            </div>

            <div class="form-group">
                <label for="periodo">Período</label>
                <select id="periodo" name="periodo" required>
                    <option value="" disabled {% if not item %}selected{% endif %}>Selecione...</option>
                    <option value="1" {% if item and item.periodo == '1' %}selected{% endif %}>Manhã</option>
                    <option value="2" {% if item and item.periodo == '2' %}selected{% endif %}>Tarde</option>
                    <option value="3" {% if item and item.periodo == '3' %}selected{% endif %}>Noturno</option>
                    <option value="4" {% if item and item.periodo == '4' %}selected{% endif %}>Integral</option>
                </select>
            </div>

            <div class="form-group">
                <label for="categoria">Categoria</label>
                <select id="categoria" name="categoria" required>
                    <option value="" disabled {% if not item %}selected{% endif %}>Selecione...</option>
                    {% for cat in categorias %}
                        <option value="{{ cat }}" {% if item and item.categoria == cat %}selected{% endif %}>{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-actions" style="border-top: 1px solid var(--cor-borda); margin-top: 2rem; padding-top: 1.5rem;">
            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Salvar</button>
            <a href="{{ cancel_url }}" class="btn" style="background-color: #A0AEC0; color: white;">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}

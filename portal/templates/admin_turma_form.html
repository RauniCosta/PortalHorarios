{% extends "admin_layout.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card" style="max-width: 800px; margin: auto;">
        <div class="card-header"><h3 class="card-title">{{ title }}</h3></div>
        <div class="card-body">
            <form method="POST">
                <div class="form-group">
                    <label for="apelido">Apelido (ID)</label>
                    <input type="text" class="form-control" id="apelido" name="apelido" value="{{ turma.apelido if turma else '' }}" readonly>
                </div>
                <div class="form-group">
                    <label for="nome">Nome Completo da Turma</label>
                    <input type="text" class="form-control" id="nome" name="nome" value="{{ turma.nome if turma else '' }}" required>
                </div>

                <div class="form-group">
                    <label for="categoria">Categoria</label>
                    <select id="categoria" name="categoria" class="form-control" required>
                        <option value="">-- Selecione a Categoria --</option>
                        {% for cat in categorias_curso %}
                            <option value="{{ cat }}" {% if turma and turma.categoria == cat %}selected{% endif %}>{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="periodo">Período</label>
                    <select id="periodo" name="periodo" class="form-control" required>
                        <option value="">-- Selecione o Período --</option>
                        <option value="Manhã" {% if turma and turma.periodo == 'Manhã' %}selected{% endif %}>Manhã</option>
                        <option value="Tarde" {% if turma and turma.periodo == 'Tarde' %}selected{% endif %}>Tarde</option>
                        <option value="Noturno" {% if turma and turma.periodo == 'Noturno' %}selected{% endif %}>Noturno</option>
                        <option value="Integral" {% if turma and turma.periodo == 'Integral' %}selected{% endif %}>Integral</option>
                    </select>
                </div>
                <hr>
                <div class="d-flex justify-content-end">
                    <a href="{{ url_for('main.turmas_list') }}" class="btn btn-secondary me-2">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

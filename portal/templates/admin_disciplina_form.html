{% extends "admin_layout.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">{{ title }}</h3>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="id" class="form-label">ID da Disciplina (Ex: MAT, POR, HIST)</label>
                            <input type="text" class="form-control" id="id" name="id" value="{{ disciplina.id if disciplina else '' }}" {% if action == 'edit' %}readonly{% endif %} required>
                        </div>
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome da Disciplina (Ex: Matemática, Língua Portuguesa)</label>
                            <input type="text" class="form-control" id="nome" name="nome" value="{{ disciplina.nome if disciplina else '' }}" required>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-end">
                            <a href="{{ url_for('main.disciplinas_list') }}" class="btn btn-secondary me-2">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Salvar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
